name: Telegram Bot Check Workflow

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install python-telegram-bot google-generativeai PyPDF2 python-docx

    - name: Verify Code Syntax
      run: |
        python -m py_compile bot_gemini.py

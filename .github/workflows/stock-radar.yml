name: Stock Radar Bot

on:
  schedule:
    # كل 5 دقائق من 08:00 إلى 23:55 UTC (يغطي Pre + Main + Post في الصيف والشتاء)
    - cron: '*/5 8-23 * * 1-5'
    # كل 5 دقائق من 00:00 إلى 00:55 UTC (يغطي نهاية Post-Market في الشتاء التي تتجاوز منتصف الليل)
    - cron: '*/5 0 * * 2-6'
  workflow_dispatch:  # تشغيل يدوي عند الحاجة

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run Stock Radar Bot
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
        run: |
          python main.py

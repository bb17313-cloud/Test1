name: stock-radar

on:
  schedule:
    - cron: "*/5 8-23 * * 1-5"
    - cron: "*/5 0-1 * * 2-6"
  workflow_dispatch:

concurrency:
  group: stock-radar
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Restore seen_stocks.json
        uses: actions/cache/restore@v4
        with:
          path: seen_stocks.json
          key: seen-stocks-${{ github.run_id }}
          restore-keys: |
            seen-stocks-

      - name: Run scanner
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python main.py

      - name: Save seen_stocks.json
        if: always() && hashFiles('seen_stocks.json') != ''
        uses: actions/cache/save@v4
        with:
          path: seen_stocks.json
          key: seen-stocks-${{ github.run_id }}

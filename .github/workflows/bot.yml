name: telegram-bot

on:
  schedule:
    - cron: "0 * * * *"     # تحقق كل ساعة (يبقى تشغيل واحد فقط بفضل concurrency)
  workflow_dispatch:         # تشغيل يدوي من تبويب Actions

# تشغيل واحد في كل مرة؛ التشغيل الجديد ينتظر انتهاء الحالي ثم يبدأ فوراً
concurrency:
  group: telegram-bot
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 355

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install OCR (لاستخراج النص من الصور)
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-ara

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 lxml deep-translator pypdf python-docx \
                      python-pptx openpyxl yfinance pandas pillow pytesseract

      - name: Run bot
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}   # اختياري: "MyBot myemail@gmail.com"
          RUN_SECONDS: "20700"                            # ~5 ساعات و45 دقيقة
        run: python bot.py
